apiVersion: apps/v1
kind: Deployment

metadata:
  name: nodejs-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
        - name: nodejs-container
          image: kiran1975/nodejs-demo:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 3000